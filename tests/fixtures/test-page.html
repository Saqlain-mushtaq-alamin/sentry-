<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentry Action Layer Test Page</title>
  <style>
    .hidden { display: none; }
    .offscreen { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the Test Page</h1>
    <nav>
      <a href="/home">Home</a>
      <a href="/about" class="active">About</a>
    </nav>
  </header>
  
  <main>
    <section>
      <h2>Login Form</h2>
      <form id="test-form">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="Enter email" required />
        
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required />
        
        <button id="submit" type="submit" data-testid="login-btn">Sign In</button>
      </form>
    </section>

    <section>
      <h2>Settings</h2>
      <select id="country" name="country">
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
      </select>
    </section>

    <section>
      <h2>Invisible Elements</h2>
      <div class="hidden">You can't see me</div>
      <input type="hidden" name="csrf" value="12345" />
      <button aria-hidden="true">Hidden Button</button>
    </section>

    <a id="nav-link" href="/next-page" role="button">Go to Next Page</a>
    
    <div id="empty-container"></div>
  </main>
</body>
</html>
