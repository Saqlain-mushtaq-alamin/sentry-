appId: com.sentry.browser
productName: Sentry Browser
directories:
  output: release
files:
  - dist/**/*
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage

# Phase 15 — beta distribution pipeline.
# `npm run package:beta` stamps extraMetadata.channel=beta so builds self-
# identify as beta (resolveChannel in src/main/index.ts) and publish to the
# generic feed below under the "beta" channel (latest-beta.yml).
# Override the feed at runtime with SENTRY_UPDATE_URL for QA/staging installs.
publish:
  provider: generic
  url: https://updates.sentrybrowser.dev
  channel: beta
